name: "🚀 CI/CD Pipeline - Kaba-Delivery"

on:
  push:
    branches: [ master, feature/develop ]
  pull_request:
    branches: [ master ]

jobs:

  # ============================================
  # STAGE 1 : Lint, Test & Vérification Django
  # ============================================
  lint-test:
    name: "🐍 Backend Verification & Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage flake8

      - name: "✅ Vérification configuration Django"
        run: |
          python manage.py check || true

      - name: "✨ Lint avec flake8"
        run: |
          flake8 . --count --max-line-length=127 \
          --exclude=migrations,venv,env \
          --statistics

      - name: "🧪 Run tests avec coverage"
        run: |
          coverage run -m pytest
          coverage xml -o coverage.xml
          coverage report --fail-under=80

      - name: "💾 Upload coverage report"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

      - name: "✨ Logs de fin Tests"
        run: |
          echo "✅ Tests et vérifications terminés !"
          echo "🕒 Heure : $(date)"
          echo "🆔 Commit : ${{ github.sha }}"

  # ============================================
  # STAGE 2 : Code Quality - SonarQube
  # ============================================
  sonarqube:
    name: "📊 Code Quality - SonarQube"
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📥 Download coverage report"
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: "🔍 SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "🚦 SonarQube Quality Gate"
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: "✨ Logs SonarQube"
        run: |
          echo "✅ Analyse SonarQube terminée !"
          echo "🕒 Heure : $(date)"
          echo "🆔 Commit : ${{ github.sha }}"

  # ============================================
  # STAGE 3 : Build & Push Docker Hub
  # ============================================
  build-push:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push'

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔑 Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🏗️ Build & Push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/interlocal:latest
            ${{ secrets.DOCKER_USERNAME }}/interlocal:${{ github.sha }}

      - name: "✅ Confirmation Build Docker"
        run: |
          echo "✅ Image Docker buildée et envoyée !"
          echo "🐳 Image : ${{ secrets.DOCKER_USERNAME }}/interlocal:latest"
          echo "🕒 Heure : $(date)"
          echo "🆔 Commit : ${{ github.sha }}"

  # ============================================
  # STAGE 4 : Scan de vulnérabilités Trivy
  # ============================================
  trivy-scan:
    name: "🛡️ Security Scan - Trivy"
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔍 Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/interlocal:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: "✅ Confirmation Scan Sécurité"
        run: |
          echo "✅ Scan Trivy terminé !"
          echo "🕒 Heure : $(date)"
          echo "🆔 Commit : ${{ github.sha }}"

  # ============================================
  # STAGE 5 : Notification Finale
  # ============================================
  notify:
    name: "📣 Notification Finale"
    runs-on: ubuntu-latest
    needs: [lint-test, sonarqube, build-push, trivy-scan]
    if: always()

    steps:
      - name: "🎉 Résumé du pipeline"
        run: |
          echo "======================================"
          echo " 🚀 PIPELINE INTERLOCAL - RÉSUMÉ"
          echo "======================================"
          echo "🔀 Branche       : ${{ github.ref_name }}"
          echo "👤 Déclenché par : ${{ github.actor }}"
          echo "📝 Commit        : ${{ github.sha }}"
          echo "🕐 Date          : $(date '+%d/%m/%Y %H:%M:%S')"
          echo "======================================"
          echo "🐍 Tests         : ${{ needs.lint-test.result }}"
          echo "📊 SonarQube     : ${{ needs.sonarqube.result }}"
          echo "🐳 Docker Build  : ${{ needs.build-push.result }}"
          echo "🛡️ Trivy Scan    : ${{ needs.trivy-scan.result }}"
          echo "======================================"
          echo "✅ Pipeline terminé"
          echo "======================================"