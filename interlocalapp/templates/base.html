<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InterLocal{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        nav { background: #2c3e50; padding: 15px 30px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #3498db; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-propose { background: #f39c12; color: white; }
        .badge-valide { background: #27ae60; color: white; }
        .badge-finance { background: #2980b9; color: white; }
        .btn { padding: 8px 16px; border-radius: 5px; text-decoration: none; font-size: 14px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        h1 { margin-bottom: 20px; color: #2c3e50; }
        h2 { margin-bottom: 10px; color: #2c3e50; }
        .progress-bar { background: #ecf0f1; border-radius: 10px; height: 10px; margin: 8px 0; }
        .progress-fill { background: #27ae60; height: 10px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #ecf0f1; }
        tr:hover { background: #f8f9fa; }
    </style>
</head>
<body>
    <nav>
        <a href="/">🏠 Accueil</a>
        <a href="/projets/">📁 Projets</a>
        <a href="/utilisateurs/">👥 Utilisateurs</a>
        <a href="/investissements/">💰 Investissements</a>
        <a href="/api/">🔌 API</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
